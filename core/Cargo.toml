[package]
name = "geo_core"
version = "0.1.0"
edition = "2021"

[lib]
name = "geo_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
proj = "0.27"
uuid = { version = "1.26.1", features = ["v4", "serde"] }
thiserror = "2.0.21"

[dependencies.pyo3]
version = "0.20"
features = ["extension-module", "abi3-py37"]
optional = true

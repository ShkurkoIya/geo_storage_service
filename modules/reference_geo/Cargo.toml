[package]
name = "reference_geo"
version = "0.1.0"
edition = "2021"

[dependencies]
sqlx = { version = "0.7", features = ["runtime-tokio-native-tls", "postgres", "uuid", "chrono", "macros"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
futures-util = "0.3"
tokio-util = { version = "0.7", features = ["io"] }
tracing = "0.1"
tokio = { version = "1.35", features = ["full", "macros"] }
tower = { version = "0.4", features = ["util"] }
http-body-util = "0.1"
geo-types = { version = "0.7", features = ["serde"] }
geo_core = { path = "../../core" }
bytes = "1.12.1"
axum = { version = "0.8.9", features = ["macros"] }
